<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn a Skill | Skill Swap</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-page">

    <nav class="dashboard-nav">

        <div class="dashboard-logo">
            <div class="small-logo">SS</div>
            <span>Skill Swap</span>
        </div>

        <div class="dashboard-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/browse">Find Skills</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>

    </nav>


    <main class="skill-form-container">

        <div class="skill-form-box">

            <div class="skill-form-icon">
                📚
            </div>

            <h1>What Do You Want to Learn?</h1>

            <p class="skill-form-subtitle">
                Tell us what skill you want to learn so we
                can help you find the right Skill Swap partner.
            </p>


            <form method="POST" action="/learn-skill">

                <label for="skill">
                    Skill You Want to Learn
                </label>

                <input
                    type="text"
                    id="skill"
                    name="skill"
                    placeholder="e.g. Video Editing"
                    required
                >


                <label for="category">
                    Category
                </label>

                <select id="category" name="category" required>

                    <option value="">
                        Select a category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Design">
                        Design
                    </option>

                    <option value="Music">
                        Music
                    </option>

                    <option value="Photography">
                        Photography
                    </option>

                    <option value="Writing">
                        Writing
                    </option>

                    <option value="Cooking">
                        Cooking
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="level">
                    Learning Level
                </label>

                <select id="level" name="level" required>

                    <option value="">
                        Select your level
                    </option>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>


                <label for="description">
                    What Do You Want to Learn?
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Tell us what you want to learn..."
                    required
                ></textarea>


                <button type="submit" class="auth-button">
                    Add Learning Goal
                </button>

            </form>


            <a href="/dashboard" class="back-home">
                ← Back to Dashboard
            </a>

        </div>

    </main>

</body>
  </html>

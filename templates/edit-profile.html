<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Skill Swap</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-page">

    <nav class="dashboard-nav">

        <div class="dashboard-logo">
            <div class="small-logo">SS</div>
            <span>Skill Swap</span>
        </div>

        <div class="dashboard-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/browse">Find Skills</a>
            <a href="/profile">Profile</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>

    </nav>


    <main class="dashboard-container">

        <section class="dashboard-section">

            <div class="dashboard-card">

                <h1>Edit Your Profile</h1>

                <p>
                    Update your Skill Swap information.
                </p>


                <form method="POST" action="/edit-profile">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ session.get('name', '') }}"
                        placeholder="Your name"
                        required
                    >


                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ session.get('email', '') }}"
                        placeholder="Your email"
                        required
                    >


                    <label for="about">About Me</label>

                    <textarea
                        id="about"
                        name="about"
                        rows="5"
                        placeholder="Tell people about yourself..."
                    >{{ session.get('about', '') }}</textarea>


                    <button
                        type="submit"
                        class="dashboard-card-button"
                    >
                        Save Changes
                    </button>

                </form>


                <br>

                <a href="/profile" class="back-home">
                    ← Back to Profile
                </a>

            </div>

        </section>

    </main>

</body>

</html>

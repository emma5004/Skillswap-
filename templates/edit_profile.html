<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Skill Swap</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .edit-profile-page {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .edit-profile-box {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .edit-profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .edit-profile-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-size: 32px;
        }

        .edit-profile-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .edit-profile-header p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .edit-form-group {
            margin-bottom: 20px;
        }

        .edit-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .edit-form-group input,
        .edit-form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .edit-form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .edit-form-group input:focus,
        .edit-form-group textarea:focus {
            border-color: #4f46e5;
        }

        .save-profile-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #4f46e5;
            color: white;
        }

        .save-profile-button:hover {
            opacity: 0.92;
        }

        .cancel-profile-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #64748b;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .edit-profile-page {
                padding: 25px 15px;
            }

            .edit-profile-box {
                padding: 25px 20px;
            }

            .edit-profile-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body class="dashboard-page">

    <nav class="dashboard-nav">

        <div class="dashboard-logo">
            <div class="small-logo">SS</div>
            <span>Skill Swap</span>
        </div>

        <div class="dashboard-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/browse">Find Skills</a>
            <a href="/profile">Profile</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>

    </nav>


    <main class="edit-profile-page">

        <div class="edit-profile-box">

            <div class="edit-profile-header">

                <div class="edit-profile-icon">
                    👤
                </div>

                <h1>Edit Profile</h1>

                <p>
                    Update your information so other
                    Skill Swap members can know you better.
                </p>

            </div>


            <form method="POST" action="/edit-profile">

                <div class="edit-form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ name }}"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="edit-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email }}"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="edit-form-group">

                    <label for="about">
                        About Me
                    </label>

                    <textarea
                        id="about"
                        name="about"
                        placeholder="Tell other Skill Swap members about yourself..."
                    >{{ about }}</textarea>

                </div>


                <button
                    type="submit"
                    class="save-profile-button"
                >
                    Save Changes
                </button>

            </form>


            <a
                href="/profile"
                class="cancel-profile-button"
            >
                ← Back to Profile
            </a>

        </div>

    </main>

</body>

        </html>

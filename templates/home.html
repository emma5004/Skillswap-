{% extends "base.html" %}

{% block content %}

<div class="page">

    <div class="home-card">

        <!-- Skill Swap Logo -->
        <img
            src="{{ url_for('static', filename='logo.png') }}"
            alt="Skill Swap Logo"
            class="logo"
        >

        <!-- Title -->
        <h1 class="home-title">
            Skill Swap
        </h1>

        <!-- Tagline -->
        <p class="home-subtitle">
            Share Skills, Grow Together
        </p>

        <!-- Login -->
        <a href="/login"
           class="home-button login-button">
            Login
        </a>

        <!-- Sign Up -->
        <a href="/signup"
           class="home-button signup-button">
            Sign Up
        </a>

    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 SkillSwap. All rights reserved.
    </div>

</div>

{% endblock %}

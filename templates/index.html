<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Swap</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f7fa;
}

.container{
    text-align:center;
}

.logo{
    font-size:48px;
    font-weight:bold;
    color:#007BFF;
    margin-bottom:40px;
}

.btn{
    display:block;
    width:220px;
    padding:15px;
    margin:15px auto;
    text-decoration:none;
    color:white;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.login{
    background:#007BFF;
}

.signup{
    background:#28a745;
}

.btn:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">Skill Swap</div>

    <a href="/login" class="btn login">Login</a>
    <a href="/signup" class="btn signup">Sign Up</a>
</div>

</body>
                                                </html>

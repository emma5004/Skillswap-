{% extends "base.html" %}

{% block content %}
<style>
.logo {
    text-align: center;
    margin-bottom: 25px;
}
.logo img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}
</style>

<div class="card" style="text-align:center;">
    
    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SkillSwap Logo">
    </div>

    <h1 style="color:var(--primary); font-size:32px; margin-bottom:10px;">Skill Swap</h1>
    <p style="margin-bottom:25px;">Share Skills, Grow Together</p>

    <a href="{{ url_for('login') }}" class="btn" style="width:100%; margin-bottom:12px;">Login</a>
    
    <a href="{{ url_for('signup') }}" class="btn" style="width:100%; background:linear-gradient(135deg,#22c55e,#16a34a);">Sign Up</a>
</div>
{% endblock %}

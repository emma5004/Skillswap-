<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teach a Skill - SkillSwap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/find-skills">Find Skills</a>
        <a href="/teach-skill">Teach</a>
        <a href="/browse">Browse</a>
        <a href="/login">Login</a>
        <a href="/signup">Sign Up</a>
    </nav>
    <div class="container">
        <h1>Create Account</h1>

        <!-- THIS SHOWS SUCCESS/ERROR MESSAGES -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p style="background:#d4edda; padding:10px; border-radius:5px; color:#155724; margin-bottom:15px;">
              {{ messages[0] }}
            </p>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Full Name:</label><br>
            <input type="text" name="name" required><br><br>
            
            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>
            
            <label>Password:</label><br>
            <input type="password" name="password" required><br><br>
            
            <button type="submit" class="btn">Sign Up</button>
        </form>
    </div>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Create Account</h2>
    <form>
        <input type="text" placeholder="Full Name" required style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white;">
        <input type="email" placeholder="Email" required style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white;">
        <input type="password" placeholder="Password" required style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white;">
        <button class="btn" type="submit">Sign Up Free</button>
    </form>
</div>
{% endblock %}

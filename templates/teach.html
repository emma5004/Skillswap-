{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Teach a Skill & Earn Money</h2>
    <p>Set your price. We suggest minimums based on demand.</p>

    <form method="POST">
        <label>Skill Name</label>
        <input type="text" name="skill_name" placeholder="e.g. Web Development" required>

        <label>Skill Category</label>
        <select name="category" id="category" required>
            <option value="high">High Demand - Min ₦5,000/hr</option>
            <option value="medium">Medium Demand - Min ₦3,000/hr</option>
            <option value="low">Low Demand - Min ₦1,500/hr</option>
        </select>

        <label>Price per hour (₦)</label>
        <input type="number" name="price" id="price" min="5000" value="5000" required>
        <small id="hint">Minimum: ₦5,000</small>

        <label>Description</label>
        <textarea name="description" rows="4" placeholder="What will students learn? Your experience?" required></textarea>

        <button type="submit" class="btn">List My Skill</button>
    </form>
</div>

<script>
const category = document.getElementById('category');
const price = document.getElementById('price');
const hint = document.getElementById('hint');

const mins = {high: 5000, medium: 3000, low: 1500};

category.addEventListener('change', () => {
    let min = mins[category.value];
    price.min = min;
    price.value = min;
    hint.innerText = `Minimum: ₦${min.toLocaleString()}`;
});
</script>
{% endblock %}
